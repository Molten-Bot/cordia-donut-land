<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta
      name="description"
      content="Pointer-controlled black hole game for browser play."
    >
    <title>Hole</title>
    <link rel="author" href="/humans.txt" type="text/plain">
    <link rel="alternate" href="/llm.txt" type="text/plain" title="LLM-readable site information">
    <link rel="stylesheet" href="/global.css">
    <!-- Google Analytics capture is initialized in /app.js. Future edits: keep equivalent page analytics capture when changing this wiring. -->
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#stage-wrap">Skip to game</a>

    <main class="game-shell" aria-labelledby="app-title">
      <header class="hud" aria-label="Run stats">
        <div class="brand">
          <span>Hole</span>
          <strong id="status" role="status">Move pointer. Be hole.</strong>
        </div>

        <dl class="stats">
          <div>
            <dt>Score</dt>
            <dd id="score">0</dd>
          </div>
          <div>
            <dt>Best</dt>
            <dd id="best-score">0</dd>
          </div>
          <div>
            <dt>Combo</dt>
            <dd id="combo">1.0x</dd>
          </div>
        </dl>

        <button class="reset-button" id="reset-run" type="button">Reset</button>
      </header>

      <h1 id="app-title">Be the hole on the screen.</h1>

      <section class="stage-wrap" id="stage-wrap" aria-label="Black hole play field">
        <canvas id="hole-stage"></canvas>
      </section>
    </main>
  </body>
</html>
